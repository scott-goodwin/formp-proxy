include "backend.conf"

# This is the main configuration file for the application.
# ~~~~~

appName = formp-proxy

# Default http client
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.internalauth.client.modules.InternalAuthModule"

# Play Modules
play.modules.enabled += "uk.gov.hmrc.formpproxy.Module"


# The application languages
# ~~~~~
play.i18n.langs = ["en"]

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# !!!WARNING!!! DO NOT CHANGE THIS ROUTER
play.http.router = prod.Routes

# Controller
# ~~~~~
# By default all controllers will have authorisation, logging and
# auditing (transaction monitoring) enabled.
# The below controllers are the default exceptions to this rule.

# Microservice specific config


microservice {
  services {
    auth {
      host = localhost
      port = 8500
    }

    internal-auth {
      host = localhost
      port = 8470
    }
  }
}

database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = 30
  }
}

oracle.cis {
  db.host = "localhost"
  db.port = "1521"
  dbName = "xe"
  username = "cis_file_data"
  password = "cis_file_data"
  connectionTimeout = 50s
  validationTimeout = 3s
  idleTimeout = 10m
  maximumPoolSize = 10
  protocol = TCP
  sslServerCertDn = "N/A"
  connectionType = SID
}


oracle.sdlt {
  db.host = "localhost"
  db.port = "1523"
  dbName = "FREEPDB1"
  username = "sdlt_file_data"
  password = "sdlt_file_data"
  connectionTimeout = 50s
  validationTimeout = 3s
  idleTimeout = 10m
  maximumPoolSize = 10
  protocol = TCP
  sslServerCertDn = "N/A"
  connectionType = SERVICE_NAME
}

oracle.sdltReadOnly {
  db.host = ${oracle.sdlt.db.host}
  db.port = ${oracle.sdlt.db.port}
  dbName = ${oracle.sdlt.dbName}
  username = "sdlt_ro"
  password = "sdlt_ro"
  connectionTimeout = ${oracle.sdlt.connectionTimeout}
  validationTimeout = ${oracle.sdlt.validationTimeout}
  idleTimeout = ${oracle.sdlt.idleTimeout}
  maximumPoolSize = 3
  protocol = ${oracle.sdlt.protocol}
  sslServerCertDn = ${oracle.sdlt.sslServerCertDn}
  connectionType = ${oracle.sdlt.connectionType}
}

oracle.charities {
  db.host = "localhost"
  db.port = "1521"
  dbName = "xe"
  username = "CHARITIES_DATA"
  password = "CHARITIES_DATA"
  connectionTimeout = 50s
  validationTimeout = 3s
  idleTimeout = 10m
  maximumPoolSize = 10
  protocol = TCP
  sslServerCertDn = "N/A"
  connectionType = SID
}

oracle.nova {
  db.host = "localhost"
  db.port = "1521"
  dbName = "xe"
  username = "nova"
  password = "nova"
  connectionTimeout = 50s
  validationTimeout = 3s
  idleTimeout = 10m
  maximumPoolSize = 10
  protocol = TCP
  sslServerCertDn = "N/A"
  connectionType = SID
}

db {
  cis {
    url = """jdbc:oracle:thin:@
                    ( DESCRIPTION=
                      ( ADDRESS_LIST=
                        (FAILOVER=ON)
                        (LOAD_BALANCE=ON)
                        ( ADDRESS=
                          (PROTOCOL="""${oracle.cis.protocol}""")
                          (HOST="""${oracle.cis.db.host}""")
                          (PORT="""${oracle.cis.db.port}""")
                        )
                      )
                      (CONNECT_DATA=
                        (SERVER=DEDICATED)
                        ("""${oracle.cis.connectionType}"""="""${oracle.cis.dbName}""")
                      )
                      (SECURITY=
                        (SSL_SERVER_CERT_DN="""${oracle.cis.sslServerCertDn}""")
                      )
                    )"""
    driver = "oracle.jdbc.OracleDriver"
    username = ${oracle.cis.username}
    password = ${oracle.cis.password}
    hikaricp {
      connectionTimeout = ${oracle.cis.connectionTimeout}
      validationTimeout = ${oracle.cis.validationTimeout}
      minimumIdle = 1
      maximumPoolSize = ${oracle.cis.maximumPoolSize}
      idleTimeout = ${oracle.cis.idleTimeout}
      maxLifetime = 1h
      poolName = "cis_filedb"
    }
  }

  sdlt {
      url = """jdbc:oracle:thin:@
                      ( DESCRIPTION=
                        ( ADDRESS_LIST=
                          (FAILOVER=ON)
                          (LOAD_BALANCE=ON)
