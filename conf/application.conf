                            (PORT="""${oracle.sdltReadOnly.db.port}""")
                          )
                        )
                        (CONNECT_DATA=
                          (SERVER=DEDICATED)
                          ("""${oracle.sdltReadOnly.connectionType}"""="""${oracle.sdltReadOnly.dbName}""")
                        )
                        (SECURITY=
                          (SSL_SERVER_CERT_DN="""${oracle.sdltReadOnly.sslServerCertDn}""")
                        )
                      )"""
      driver = "oracle.jdbc.OracleDriver"
      username = ${oracle.sdltReadOnly.username}
      password = ${oracle.sdltReadOnly.password}
      hikaricp {
        connectionTimeout = ${oracle.sdltReadOnly.connectionTimeout}
        validationTimeout = ${oracle.sdltReadOnly.validationTimeout}
        minimumIdle = 0
        maximumPoolSize = ${oracle.sdltReadOnly.maximumPoolSize}
        idleTimeout = ${oracle.sdltReadOnly.idleTimeout}
        maxLifetime = 1h
        poolName = "sdlt_ro_filedb"
      }
    }

  charities {
    url = """jdbc:oracle:thin:@
                    ( DESCRIPTION=
                      ( ADDRESS_LIST=
                        (FAILOVER=ON)
                        (LOAD_BALANCE=ON)
                        ( ADDRESS=
                          (PROTOCOL="""${oracle.charities.protocol}""")
                          (HOST="""${oracle.charities.db.host}""")
                          (PORT="""${oracle.charities.db.port}""")
                        )
                      )
                      (CONNECT_DATA=
                        (SERVER=DEDICATED)
                        ("""${oracle.charities.connectionType}"""="""${oracle.charities.dbName}""")
                      )
                      (SECURITY=
                        (SSL_SERVER_CERT_DN="""${oracle.charities.sslServerCertDn}""")
                      )
                    )"""
    driver = "oracle.jdbc.OracleDriver"
    username = ${oracle.charities.username}
    password = ${oracle.charities.password}
    hikaricp {
      connectionTimeout = ${oracle.charities.connectionTimeout}
      validationTimeout = ${oracle.charities.validationTimeout}
      minimumIdle = 1
      maximumPoolSize = ${oracle.charities.maximumPoolSize}
      idleTimeout = ${oracle.charities.idleTimeout}
