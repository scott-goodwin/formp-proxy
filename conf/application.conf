                      )
                      (SECURITY=
                        (SSL_SERVER_CERT_DN="""${oracle.nova.sslServerCertDn}""")
                      )
                    )"""
    driver = "oracle.jdbc.OracleDriver"
    username = ${oracle.nova.username}
    password = ${oracle.nova.password}
    hikaricp {
      connectionTimeout = ${oracle.nova.connectionTimeout}
