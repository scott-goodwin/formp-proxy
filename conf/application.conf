                          (SSL_SERVER_CERT_DN="""${oracle.sdlt.sslServerCertDn}""")
                        )
                      )"""
      driver = "oracle.jdbc.OracleDriver"
      username = ${oracle.sdlt.username}
      password = ${oracle.sdlt.password}
      hikaricp {
        connectionTimeout = ${oracle.sdlt.connectionTimeout}
        validationTimeout = ${oracle.sdlt.validationTimeout}
        minimumIdle = 1
        maximumPoolSize = ${oracle.sdlt.maximumPoolSize}
        idleTimeout = ${oracle.sdlt.idleTimeout}
        maxLifetime = 1h
        poolName = "sdlt_filedb"
